---
- name: Create the machine
  when: not image_exists
  become: true
  block:

    - name: Copy template image
      copy:
        src: "{{ template_path }}"
        dest: "{{ image_path }}"
        remote_src: true
      register: template_copy

    - name: Define the virtual machine
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'template.xml.j2') }}"
      register: vm_result

- name: Start the machine
  become: true
  block:

    - name: Start the virtual machine
      community.libvirt.virt:
        name: "{{ vmcreate_image_name }}"
        state: running
        command: start
      when: vm_result.changed

